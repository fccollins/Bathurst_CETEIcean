<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/tei.css">
  <script src="js/CETEI.js"></script>
  <script>
    let c = new CETEI();
    let behaviors = {
      "tei": {
        "head": function(e) {
          let level = document.evaluate("count(ancestor::tei-div)", e, null, XPathResult.NUMBER_TYPE, null);
          let result = document.createElement("h" + (level.numberValue > 7 ? 7 : level.numberValue));
          while (e.firstChild) {
            result.appendChild(e.firstChild);
          }
          return result;
        },
        "lb": ["<br>"],
        "pb": ["<p class=\"break\">$@n</p>"],
        "teiHeader": null,
        "gap": function(e) {
          let span = document.createElement('span');
          span.className = 'gap';
          let extent = e.getAttribute('extent') || '';
          let match = extent.match(/(\d+)\s*(characters?|character?|words?)/i);
          if (match) {
            let count = parseInt(match[1], 10);
            let unit = match[2].toLowerCase();
            let underscoreCount = unit.indexOf('word') === 0 ? count * 4 : count;
            span.textContent = "_".repeat(underscoreCount);
            span.title = count + " " + match[2] + " omitted";
          }
          else {
            span.textContent = "...";
          }
          return span;
        },
        /* splits out add elements based on their place attribute, for arrangement into columns */
        "add": function(e) {
          let add = document.createElement('div');
          let place = e.getAttribute('place') || e.getAttribute('dir') || 'inline';
          
          switch(place.toLowerCase()) {
            case 'left':
              add.className = 'tei-add margin-left';
              break;
            case 'right':
              add.className = 'tei-add margin-right';
              break;
            case 'above':
              add.className = 'tei-add above';
              break;
            case 'below':
              add.className = 'tei-add below';
              break;
            default:
              add.className = 'tei-add inline';
          }
          
          while (e.firstChild) {
            add.appendChild(e.firstChild);
          }
          
          if (e.getAttribute('target')) {
            add.dataset.target = e.getAttribute('target');
          }
          if (e.getAttribute('hand')) {
            add.dataset.hand = e.getAttribute('hand');
          }
          
          return add;
        },
        /* splits out metamark elements based on place attribute, as above */
        "metamark": function(e) {
          let mark = document.createElement('div');
          let place = e.getAttribute('place') || e.getAttribute('dir') || 'inline';
          
          switch(place.toLowerCase()) {
            case 'left':
              mark.className = 'tei-metamark margin-left';
              break;
            case 'right':
              mark.className = 'tei-metamark margin-right';
              break;
            case 'above':
              mark.className = 'tei-metamark above';
              break;
            case 'below':
              mark.className = 'tei-metamark below';
              break;
            default:
              mark.className = 'tei-metamark inline';
          }

          while (e.firstChild) {
            mark.appendChild(e.firstChild);
          }
          
          if (e.getAttribute('target')) {
            mark.dataset.target = e.getAttribute('target');
          }
          if (e.getAttribute('hand')) {
            mark.dataset.hand = e.getAttribute('hand');
          }
          
          return mark;
        }
      }
    }
    c.addBehaviors(behaviors);
    c.getHTML5('TEI_MSS_Rawl_D_1262.xml'/*'Chets_A_7.64_vol_1.xml'*/, function(data){
      let body = document.getElementsByTagName('body')[0];
      
      // Create grid container
      let container = document.createElement('div');
      container.className = 'tei-container';
      
      // Create three column containers
      let leftMargin = document.createElement('aside');
      leftMargin.className = 'margin-column margin-left';
      
      let mainText = document.createElement('article');
      mainText.className = 'main-column main-text';
      
      let rightMargin = document.createElement('aside');
      rightMargin.className = 'margin-column margin-right';
      
      // Distribute content between columns
      extractMarginalAnnotations(data, leftMargin, mainText, rightMargin);
      
      // Assemble grid
      container.appendChild(leftMargin);
      container.appendChild(mainText);
      container.appendChild(rightMargin);
      
      body.appendChild(container);
    });
    
    // Modified extraction - keeps inline elements in main text flow
    function extractMarginalAnnotations(source, leftContainer, mainContainer, rightContainer) {
      Array.from(source.childNodes).forEach(child => {
        // Only move LEFT/RIGHT marginal annotations
        if (child.classList && child.classList.contains('margin-left')) {
          leftContainer.appendChild(child);
        } else if (child.classList && child.classList.contains('margin-right')) {
          rightContainer.appendChild(child);
        } else {
          // ALL OTHER content stays in main text (including inline add/del/metamark)
          mainContainer.appendChild(child.cloneNode(true));
        }
      });
    }
  </script>
</head>
<body>
</body>
</html>
