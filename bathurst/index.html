<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/tei.css">
  <script src="js/CETEI.js"></script>
  <script>
    let c = new CETEI();
    let behaviors = {
      "tei": {
        "head": function(e) {
          let level = document.evaluate("count(ancestor::tei-div)", e, null, XPathResult.NUMBER_TYPE, null);
          let result = document.createElement("h" + (level.numberValue>7 ? 7 : level.numberValue));
          for (let n of Array.from(e.childNodes)) {
            result.appendChild(n.cloneNode());
          }
          return result;
        },
        "lb": ["<br>"],
        /* Insert a <p> with the content of the <pb>'s @n attribute inside it
           Add a line above with CSS */
        "pb": ["<p class=\"break\">$@n</p>"],
        /* attempt to fix <add> rendering in head */
        "head": function(e) {
          let level = document.evaluate("count(ancestor::tei-div)", e, null, XPathResult.NUMBER_TYPE, null);
          let hTag = "h" + (level.numberValue > 7 ? 7 : level.numberValue);
          let result = document.createElement(hTag)
          result.innerHTML = e.innerHTML;
          return result;
        },
        "teiHeader": null,
        "gap": function(e) {
          let span = document.createElement('span');
          span.className = 'gap';
          // Get the extent attribute (e.g., "4 characters" or "2 words")
          let extent = e.getAttribute('extent') || '';
          // Parse numeric value and unit
          let match = extent.match(/(\d+)\s*(characters?|words?)/i);
          if (match) {
            let count = parseInt(match[1], 10);
            let unit = match[2].toLowerCase();
            // render based on characters vs words
            let underscoreCount;
            if (unit.indexOf('word') == 0o0) {
              underscoreCount = count * 4;
            } else {
              underscoreCount = count;
            }
            span.textContent = "_".repeat(underscoreCount);
            span.title = count + " " + match[2] + " characters omitted";
          }
          else {
            // fallback for unparseable extent
            span.textContent = "...";
          }
          return span;
        }
      }
    }; 
    c.addBehaviors(behaviors);
    c.getHTML5('Chets_A_7.64_vol_1.xml', function(data){
      document.getElementsByTagName('body')[0].appendChild(data);
    });
  </script>
</head>

</body>
</html>
